services:
  app1:
    build: .
    container_name: highload-app-1
    environment:
      INSTANCE_ID: app1
    expose:
      - "8000"

  app2:
    build: .
    container_name: highload-app-2
    environment:
      INSTANCE_ID: app2
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: highload-nginx-gateway
    depends_on:
      - app1
      - app2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  nginx_cache:

